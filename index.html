    <link rel="stylesheet" href="styles.css" />

    <div class="page">
      <header class="hero">
        <p class="eyebrow">A DAILY CHECK-IN</p>
        <h1>Healthy Habits</h1>
        <p>A small check-in for the habits that help you feel well.</p>
      </header>

      <section class="day-controls" aria-label="Daily check-in controls">
        <div class="day-picker">
          <label class="eyebrow" for="day-select">YOUR DAY</label>
          <select id="day-select" aria-label="Select a day of the week">
            <option>Monday</option>
            <option>Tuesday</option>
            <option>Wednesday</option>
            <option>Thursday</option>
            <option>Friday</option>
            <option>Saturday</option>
            <option>Sunday</option>
          </select>
        </div>
        <div class="control-actions">
          <button id="theme-toggle" class="button button-theme" type="button" aria-label="Switch to night theme" title="Switch to night theme" aria-pressed="false">
            <svg class="theme-icon icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M20.2 15.4A8.5 8.5 0 0 1 8.6 3.8 8.6 8.6 0 1 0 20.2 15.4Z" />
            </svg>
            <svg class="theme-icon icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" />
            </svg>
          </button>
          <button id="reset-day" class="button button-reset" type="button">Reset day</button>
          <button id="weekly-recap" class="button button-recap" type="button">Weekly recap</button>
        </div>
      </section>

      <main class="week-grid">
        <section class="day-card" data-day="Monday">
          <div class="day-heading"><div><h2>Monday</h2><p class="day-date" data-day-date="Monday"></p></div></div>
          <label class="gratitude-label" for="gratitude-monday">3 things I'm grateful for or excited about today</label>
          <textarea id="gratitude-monday" class="gratitude-input" data-day="Monday" rows="3" placeholder="A person, a small joy, something ahead..."></textarea>
          <div class="habit-list">
            <label class="check-row"><input type="checkbox" class="habit-check" data-day="Monday" data-practice="Care and playtime with Charlie" /><span>Care and playtime with Charlie</span></label>
            <label class="check-row"><input type="checkbox" class="habit-check" data-day="Monday" data-practice="Stretch/Exercise" /><span>Stretch/Exercise</span></label>

            <label class="check-row"><input type="checkbox" class="habit-check" data-day="Monday" data-practice="Make Bed" /><span>Make Bed</span></label>
            <label class="check-row"><input type="checkbox" class="habit-check" data-day="Monday" data-practice="Give and receive love with friends, family, or community" /><span>Give and receive love with friends, family, or community</span></label>
            <label class="check-row"><input type="checkbox" class="habit-check" data-day="Monday" data-practice="0-2 Trades max" /><span>0-2 Trades max</span></label>
            <label class="check-row"><input type="checkbox" class="habit-check" data-day="Monday" data-practice="Tea/Water instead of dessert" /><span>Tea/Water instead of dessert</span></label>
            <label class="check-row"><input type="checkbox" class="habit-check" data-day="Monday" data-practice="Play/Create time (15min or more)" /><span>Play/Create time (15min or more)</span></label>
            <label class="check-row"><input type="checkbox" class="habit-check" data-day="Monday" data-practice="Read (15min or more)" /><span>Read (15min or more)</span></label>
            <label class="check-row"><input type="checkbox" class="habit-check" data-day="Monday" data-practice="In bed by 11pm" /><span>In bed by 11pm</span></label>
          </div>
          <p class="checkin-message" role="status" aria-live="polite" hidden></p>
          <label class="gratitude-label" for="notes-monday">Additional Notes</label>
          <textarea id="notes-monday" class="notes-input" data-day="Monday" rows="3" placeholder="Anything else you want to remember..."></textarea>
